name: Build AI Face Live APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar APK (debug) e testes unitários
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Extrair ZIP (se existir)
        run: |
          find . -maxdepth 1 -name "*.zip" | while read -r Z; do
            echo "Extraindo: $Z"
            unzip -q -o "$Z" -d _projeto
          done

      - name: Localizar o projeto Android
        id: proj
        run: |
          FILE=$(find . -name settings.gradle.kts -not -path "*/node_modules/*" -not -path "*/.git/*" | head -n 1)
          if [ -z "$FILE" ]; then
            echo "::error::Projeto Android não encontrado."
            ls -laR | head -n 50
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Projeto encontrado em: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar componentes do SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-read-only: false

      - name: Gerar Gradle Wrapper
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle wrapper --gradle-version 8.13 --no-daemon

      - name: Testes unitários
        working-directory: ${{ steps.proj.outputs.dir }}
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Compilar APK debug
        working-directory: ${{ steps.proj.outputs.dir }}
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Enviar APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-face-live-debug
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
