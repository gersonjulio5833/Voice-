name: Build AI Face Live APK

on:
  push:
    branches: [main, master]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar APK (debug) e testes unitários
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: android

    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar componentes do SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-read-only: false

      - name: Gerar Gradle Wrapper
        run: gradle wrapper --gradle-version 8.13 --no-daemon

      - name: Testes unitários
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Compilar APK debug
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Enviar APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-face-live-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
